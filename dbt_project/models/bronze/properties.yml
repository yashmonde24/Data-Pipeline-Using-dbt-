version: 2 

model:
    - name: bronze_date # match the filename of the model
      config:
        +materialized: view 
        schema: bronze

    - name: bronze_product
      config:
        +materailized: view 
        schema: bronze
      
    - name: bronze_sales #table_name
      config:
          +materailized: view 
          schema: bronze
      columns:
        - name: sales_id # col_name
          data_tests: 
            - unique
            - not_null
      
    - name: bronze_sales #table_name
      config:
        +materailized: view 
        schema: bronze
      columns:
        - name: store_sk # col_name
          data_tests: 
            - unique
            - not_null

        - name: gross_amount
          data_tests:
            - custom_generic



    - name: bronze_store #table_name
      columns:
        - name: store_name # col_name
          data_tests: 
            - accepted_values: ['Megamart_Mahatten']
            - accepted_values:
                agruments:
                  values: ['A']
              config:
                severity: warn
